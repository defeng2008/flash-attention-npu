# fa3_func.yaml —— flash_attn_npu_3.flash_attn_func 的 ATK 用例设计文件
# 类别：single_benchmark_cann（npu 候选 vs CANN npu_fused_infer_attention_score 标杆精度对比）（该类别不出 paged 变体：标杆 FIA 没有 page_table 入参）
#
# 这份 yaml 是本接口的**唯一真值**，用例不再手写，而是由 run 脚本现场生成：
#   atk case -f fa3_func.yaml -p . -s <seed>
#     -> result/fa3_func/json/all_fa3_func.json
#     -> 拷成 cases/all_fa3_func.json（交付里可直接打开查看）
#
# 两个必须知道的约定：
#  1) ATK 会按下面的取值范围**逐维独立**随机每个输入，所以 k/v/qv/cache/索引张量
#     之间不可能自洽；跨输入的耦合全部由 generate_fa3_func.py 里的钩子按 MLA 的
#     数学契约统一改写（头数、末维、cache 与索引张量的内容/长度等）。
#     因此这里只写「每一维的候选取值」，不描述输入之间的对应关系。
#  2) 形态由 q 的最后一维决定：
#       64  -> decode 吸收态（qv 生效，Hk=1，Dq=64，Dk=64，Dv=512）
#       192 -> prefill（Dq=Dk=192=nope128+rope64，Dv=128，钩子会把 qv 摘掉）
#
# 生成后每条用例的形状（钩子改写之后）：
#   BSND prefill : q[B,Sq,32,192]  k[B,Sk,32,192]   v[B,Sk,32,128]
#   BSND decode  : q[B,Sq,32,64]   qv[B,Sq,32,512]  k[B,Sk,1,64]  v[B,Sk,1,512]
name: flash_attn_npu_3.flash_attn_func
api: pytorch
api_type: fa3_func_mla_accuracy
version: v2.1
generate: fa3_func_mla_constraints

# 用例条数：本文件所有输入都只有 1 个 dtype，所以总条数 = dtype_numbers = 100
dtype_numbers: 100
# 关掉边界/空 tensor 用例：q.shape 为空时钩子无法判断 prefill/decode
extra_numbers: 0
outputs: 1

# 判据：cv_fused_double_benchmark（混合容差 atol/rtol）。bf16 的 eps 是 2^-8，
# 阈值 2.0 约等于「最大相对误差 <= 0.78%」；mem 只在 gpu_mem_compare 用得到。
standard:
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 2.0
      avg_re_ratio: 1.2
      root_mean_squared_ratio: 1.2
  perf: not_key
  mem: 1.1
shape_distributions: [[0, 1.0]]

# 输入声明。tensor 用 dim_values 给每一维的候选取值；attr 用 ranges.valid.values 给离散值。
inputs:
  # q: [batch, seqlen_q, Hq, Dq]
  - name: q
    type: tensor
    required: false
    dtypes: {values: [bf16]}
    shapes:
      dim_numbers: {values: [4]}
      dim_values:
        - values: [1, 2]
        - values: [1, 64, 198, 512]
        - values: [32]
        - values: [64, 192]
    ranges:
      valid:
        values: [[-5.0, 5.0]]
  # k: [batch, kv_len, Hk, Dk]
  - name: k
    type: tensor
    required: false
    dtypes: {values: [bf16]}
    shapes:
      dim_numbers: {values: [4]}
      dim_values:
        - values: [1, 2]
        - values: [1, 64, 198, 256, 384, 512, 1025]
        - values: [1, 32]
        - values: [64, 192]
    ranges:
      valid:
        values: [[-5.0, 5.0]]
  # v: [batch, kv_len, Hk, Dv]
  - name: v
    type: tensor
    required: false
    dtypes: {values: [bf16]}
    shapes:
      dim_numbers: {values: [4]}
      dim_values:
        - values: [1, 2]
        - values: [1, 64, 198, 256, 384, 512, 1025]
        - values: [1, 32]
        - values: [128, 512]
    ranges:
      valid:
        values: [[-5.0, 5.0]]
  # qv: 吸收态专用；prefill 用例会被钩子摘掉
  - name: qv
    type: tensor
    required: false
    dtypes: {values: [bf16]}
    shapes:
      dim_numbers: {values: [4]}
      dim_values:
        - values: [1, 2]
        - values: [1, 64, 198, 512]
        - values: [32]
        - values: [512]
    ranges:
      valid:
        values: [[-5.0, 5.0]]
  # MLA 固定 192^-0.5
  - name: softmax_scale
    type: attr
    required: false
    dtypes: {values: [float]}
    ranges:
      valid:
        values: [0.07216878364870322]
  # causal / 非 causal 各一半
  - name: causal
    type: attr
    required: false
    dtypes: {values: [bool]}
    ranges:
      valid:
        values: [false, true]
